<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brand Atlas</title>
  <style>
    :root{--ink:#111827;--muted:#667085;--gold:#c89b4b;--paper:#f4f1e9;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,sans-serif}main{min-height:100vh;display:grid;grid-template-columns:minmax(300px,42%) 1fr}.intro{padding:8vw 7vw;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#e0b967;letter-spacing:.18em;font-size:12px;font-weight:700}.intro h1{font-size:clamp(48px,7vw,96px);line-height:.95;margin:22px 0}.intro p{color:#cbd5e1;max-width:520px}.work{padding:8vw 7vw;display:flex;align-items:center}.panel{width:min(620px,100%)}h2{font-size:34px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:24px 0 8px}input{width:100%;padding:15px 16px;border:1px solid #c9c3b5;border-radius:6px;background:#fff;font:inherit}button{margin-top:24px;padding:15px 22px;border:0;border-radius:6px;background:var(--gold);color:#111827;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:28px;padding-top:22px;border-top:1px solid #d6d0c3}.status[hidden]{display:none}.state{font-weight:700}.error{color:#9a3412;white-space:pre-wrap}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.links a{padding:10px 12px;background:#fff;border:1px solid #d6d0c3;border-radius:4px;color:#704c17;text-decoration:none}@media(max-width:760px){main{display:block}.intro,.work{padding:54px 24px}.intro h1{font-size:58px}}
  </style>
</head>
<body><main><section class="intro"><span class="eyebrow">WEBSITE EVIDENCE TOOL</span><h1>Brand<br>Atlas</h1><p>Collect sponsor and partner logos from a rendered website, then export a review gallery, PowerPoint, CSV, JSON, and original image folder.</p></section><section class="work"><div class="panel"><h2>Start a website scan</h2><p>Enter the public page that best represents the event, league, company, or property.</p><form id="form"><label for="website">Website URL</label><input id="website" name="website" type="url" required value="https://premierpadel.com/en/home-page"><label for="pages">Maximum pages</label><input id="pages" name="pages" type="number" min="1" max="100" value="12"><button id="submit">Collect brands and logos</button></form><section class="status" id="status" hidden><p class="state" id="state"></p><p id="detail"></p><p class="error" id="error"></p><div class="links" id="links"></div></section></div></section></main><script>
  const form=document.querySelector('#form'),status=document.querySelector('#status'),state=document.querySelector('#state'),detail=document.querySelector('#detail'),error=document.querySelector('#error'),links=document.querySelector('#links'),button=document.querySelector('#submit');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.hidden=false;state.textContent='Starting scan';detail.textContent='';error.textContent='';links.replaceChildren();try{const response=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({website:form.website.value,maxPages:Number(form.pages.value)})});const created=await response.json();if(!response.ok)throw new Error(created.error||'Could not start');while(true){await sleep(1400);const current=await fetch(`/api/runs/${created.id}`).then(r=>r.json());state.textContent=current.status==='running'?'Scanning rendered pages and saving logos':current.status==='queued'?'Waiting to start':current.status==='complete'?'Scan complete':'Scan failed';if(current.status==='failed')throw new Error(current.error||'Crawler failed');if(current.status==='complete'){detail.textContent=`${current.brandCount} brand records found across ${current.coverage.pagesVisited} pages. Coverage: ${current.coverage.status}.`;for(const [name,url] of Object.entries(current.files)){const a=document.createElement('a');a.href=url;a.textContent=name[0].toUpperCase()+name.slice(1);if(name!=='gallery')a.download='';links.append(a)}break}}}catch(ex){error.textContent=ex.message}finally{button.disabled=false}});
  </script></body></html>
